# Render Blueprint: one free web service runs the game page and the online server.
# In Render: New + > Blueprint > pick this repo > Apply.
services:
  - type: web
    name: bim-grow-the-island
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
